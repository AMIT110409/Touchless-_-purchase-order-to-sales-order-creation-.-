trigger:
  - main

resources:
  - repo: self

variables:
  # Container registry service connection established in Azure DevOps
  dockerRegistryServiceConnection: 'AcrConnection'
  imageRepository: 'smart-po-extraction'
  containerRegistry: 'envalioracr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  
  # Azure Container App Details
  azureSubscription: 'AzureConnection'
  resourceGroup: 'rg-envalior-automation'
  containerAppName: 'po-extraction-gpu'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Azure Container Apps
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy
    steps:
    - task: AzureContainerApps@1
      displayName: 'Deploy to Container App (GPU)'
      inputs:
        azureSubscription: $(azureSubscription)
        resourceGroup: $(resourceGroup)
        yamlConfigPath: 'aca-deployment.yml'
